<script>
(function () {
  const savedTheme = localStorage.getItem('ankit-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = savedTheme || (prefersDark ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;

  window.addEventListener('DOMContentLoaded', function () {
    const tools = document.querySelector('.quarto-navbar-tools');
    if (!tools || tools.querySelector('.theme-toggle')) return;

    const button = document.createElement('button');
    button.className = 'theme-toggle';
    button.type = 'button';
    button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    button.setAttribute('title', button.getAttribute('aria-label'));
    button.innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
    tools.appendChild(button);

    button.addEventListener('click', function () {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem('ankit-theme', nextTheme);
      const label = nextTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
      button.innerHTML = nextTheme === 'dark' ? '&#9728;' : '&#9790;';
    });
  });
})();
</script>
